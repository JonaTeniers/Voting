<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eurovision Menu</title>
<style>
:root{--bg1:#12051f;--bg2:#3e126f;--accent:#ff2fcf;--accent2:#7500ff;--card:rgba(255,255,255,.08)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,var(--bg2),var(--bg1))}
.wrap{width:min(900px,94vw);padding:26px}
h1{text-align:center;font-size:clamp(30px,6vw,58px);margin:0 0 20px;text-shadow:0 8px 30px rgba(255,0,204,.4)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
a{display:block;text-decoration:none;color:#fff;background:var(--card);border:1px solid rgba(255,255,255,.18);padding:18px;border-radius:14px;font-size:24px;font-weight:700;text-align:center;transition:.2s transform,.2s box-shadow}
a:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.25);background:linear-gradient(90deg,var(--accent),var(--accent2))}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎤 Eurovision Menu</h1>
  <div class="menu">
    <a href="admin.html">Admin</a>
    <a href="names.html">Namenlijst</a>
    <a href="scoreboard.html">Scoreboard</a>
  </div>
</div>
</body>
</html>
