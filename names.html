<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eurovision - Deelnemers</title>
<style>
:root{--bg1:#12051f;--bg2:#31105a;--accent:#ff2cc3;--accent2:#6a00ff;--glass:rgba(255,255,255,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,var(--bg2),var(--bg1));min-height:100vh;overflow:hidden}
.stage{width:min(1100px,94vw);margin:0 auto;padding:28px 0 36px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.title{font-size:clamp(28px,5vw,52px);font-weight:800;letter-spacing:1px;text-shadow:0 8px 30px rgba(255,0,200,.35)}
.badge{padding:10px 14px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));font-weight:700}
.card{background:linear-gradient(140deg,rgba(255,255,255,.11),rgba(255,255,255,.04));backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;max-height:72vh;overflow:auto;padding-right:6px}
.tile{background:var(--glass);border:1px solid rgba(255,255,255,.14);padding:14px 16px;border-radius:14px;font-size:24px;font-weight:700;animation:slideIn .45s ease both}
.tile:nth-child(odd){transform:translateX(-16px)}
.tile:nth-child(even){transform:translateX(16px)}
@keyframes slideIn{from{opacity:0;filter:blur(2px)}to{opacity:1;transform:translateX(0);filter:none}}
.empty{text-align:center;padding:42px 10px;font-size:24px;opacity:.82}
</style>
</head>
<body>
<div class="stage">
  <div class="header">
    <div class="title">🎤 EUROVISION CLASS VOTING</div>
    <div class="badge">DEELNEMERS</div>
  </div>
  <div class="card">
    <div class="grid" id="namesGrid"></div>
  </div>
</div>
<script>
function loadNames(){
  const data = JSON.parse(localStorage.getItem('eurovisionData'));
  const grid = document.getElementById('namesGrid');
  grid.innerHTML = '';

  if(!data || !data.contestants || data.contestants.length===0){
    grid.innerHTML = '<div class="empty">Nog geen namen geladen in admin.</div>';
    return;
  }

  data.contestants
    .map(c=>c.name)
    .sort((a,b)=>a.localeCompare(b,'nl'))
    .forEach((name,index)=>{
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.style.animationDelay = `${index*0.03}s`;
      tile.textContent = name;
      grid.appendChild(tile);
    });
}
loadNames();
setInterval(loadNames,1500);
</script>
</body>
</html>
