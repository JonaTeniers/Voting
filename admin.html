<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eurovision Admin</title>
<style>
body{margin:0;font-family:Arial;background:#12051f;color:white;padding:20px}
h1{text-align:center;color:#ff4dff}
.panel{background:#1d1033;padding:20px;border-radius:15px;margin-bottom:20px}
textarea{width:100%;height:180px;border:none;border-radius:10px;padding:10px;font-size:16px}
button{padding:12px 20px;border:none;border-radius:10px;cursor:pointer;font-size:16px;margin-top:10px}
.primary{background:#ff00cc;color:white}
.secondary{background:#444;color:white}
select,input{padding:10px;border-radius:10px;font-size:16px;margin:5px;border:none}
.row{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center}
.note{opacity:.85;margin-top:8px}
</style>
</head>
<body>
<h1>🎤 Eurovision Admin</h1>

<div class="panel">
<h2>Leerlingen toevoegen</h2>
<textarea id="namesInput" placeholder="1 naam per regel"></textarea>
<br>
<button class="primary" onclick="loadNames()">Namen laden</button>
<button class="secondary" onclick="resetAll()">Reset alles</button>
</div>

<div class="panel">
<h2>Punten ingeven (handmatig totaal)</h2>
<div class="row">
<select id="scoreTarget"></select>
<input id="scoreAmount" type="number" value="0" step="1" placeholder="Aantal punten">
<button class="primary" onclick="addToTotal()">Punten optellen</button>
<button class="secondary" onclick="setTotal()">Totaal instellen</button>
</div>
<p class="note">Gebruik deze modus als jij zelf alle punten optelt en daarna direct bij de juiste leerling zet.</p>
</div>

<div class="panel">
<h2>Presentatiepagina's</h2>
<button class="primary" onclick="window.open('names.html','_blank')">Open namenpagina</button>
<button class="primary" onclick="window.open('scoreboard.html','_blank')">Open scorepagina</button>
</div>


<div class="panel">

<h2>Presentatiepagina's</h2>

<button class="primary" onclick="window.open('names.html','_blank')">
Open namenpagina
</button>

<button class="primary" onclick="window.open('scoreboard.html','_blank')">
Open scorepagina
</button>

</div>

<script>
const state = {contestants:[]};

function save(){
  localStorage.setItem('eurovisionData', JSON.stringify(state));
}

function load(){
  const data = localStorage.getItem('eurovisionData');
  if(data){
    const parsed = JSON.parse(data);
    state.contestants = parsed.contestants || [];
  }
}

function renderSelect(){
  const sel = document.getElementById('scoreTarget');
  sel.innerHTML='';
  state.contestants.forEach((c,i)=>{
    const o=document.createElement('option');
    o.value=i;
    o.textContent=c.name;
    sel.appendChild(o);
  });
}

function loadNames(){
  const names=document.getElementById('namesInput').value
    .split('\n').map(n=>n.trim()).filter(Boolean).sort((a,b)=>a.localeCompare(b,'nl'));

  state.contestants=names.map(name=>({name,total:0}));
  renderSelect();
  save();
  alert('Namen geladen!');
}

function getSelectedContestant(){
  const idx = Number(document.getElementById('scoreTarget').value);
  const points = Number(document.getElementById('scoreAmount').value);
  if(Number.isNaN(idx) || !state.contestants[idx]) return null;
  if(Number.isNaN(points)) return null;
  return {person: state.contestants[idx], points};
}

function addToTotal(){
  const selected = getSelectedContestant();
  if(!selected) return;
  selected.person.total = Number(selected.person.total || 0) + selected.points;
  save();
}

function setTotal(){
  const selected = getSelectedContestant();
  if(!selected) return;
  selected.person.total = selected.points;
  save();
}

function resetAll(){
  localStorage.removeItem('eurovisionData');
  location.reload();
}

load();
renderSelect();
</script>
</body>
</html>
